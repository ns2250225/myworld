<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:'VT323','PingFang SC','Hiragino Sans GB','Microsoft YaHei',monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
button{font:inherit}
.shadow{text-shadow:2px 2px 0 #3f3f3f}
/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#4a3423;background-size:64px 64px;image-rendering:pixelated;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#logo{position:relative;text-align:center}
#logo h1{margin:0;font-family:'Press Start 2P',monospace;font-size:clamp(20px,5vw,46px);color:#d8d8d8;letter-spacing:2px;text-shadow:3px 3px 0 #3a3a3a,6px 6px 0 #1d1d1d}
#logo h1 small{display:block;font-family:inherit;font-size:.38em;margin-top:14px;color:#bdbdbd;letter-spacing:1px}
#logo .cn{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;font-size:clamp(30px,7vw,64px);color:#e9e9e9;text-shadow:4px 4px 0 #3a3a3a,7px 7px 0 #1d1d1d;letter-spacing:6px}
#splash{position:absolute;right:-30px;bottom:-12px;color:#ffff3f;font-size:clamp(16px,2.6vw,24px);text-shadow:2px 2px 0 #3f3f00;transform:rotate(-16deg);animation:splash .5s ease-in-out infinite alternate;white-space:nowrap}
@keyframes splash{to{transform:rotate(-16deg) scale(1.12)}}
#loadbar{width:min(360px,80vw);height:14px;border:2px solid #fff;padding:2px}
#loadbar i{display:block;height:100%;width:0;background:#7ccf3c;transition:width .2s}
#loadtxt{font-size:22px;color:#ddd}
#enter{display:none}
/* ---------- MC buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;background:#6f6f6f;color:#fff;text-shadow:2px 2px 0 #3f3f3f;border:2px solid #000;box-shadow:inset 2px 2px 0 #a8a8a8,inset -2px -3px 0 #464646;font-size:21px;cursor:pointer;text-decoration:none;line-height:1;white-space:nowrap}
.btn:hover{background:#7484c9;box-shadow:inset 2px 2px 0 #b7c3f5,inset -2px -3px 0 #3a477d;color:#ffffa0}
.btn:active{transform:translateY(1px)}
.btn.green{background:#3f8f2e;box-shadow:inset 2px 2px 0 #7fd06a,inset -2px -3px 0 #1f5214}
.btn.green:hover{background:#4fae3a;color:#fff}
.btn.big{font-size:28px;padding:10px 34px;min-height:54px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#dbg{position:absolute;left:10px;top:8px;font-size:19px;line-height:1.15;color:#fff;text-shadow:2px 2px 0 #3f3f3f}
#dbg span{background:rgba(80,80,80,.45);padding:0 4px;display:inline-block;margin-bottom:2px}
#topbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:auto}
#topbtns button{width:42px;height:42px;font-size:20px;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 #a8a8a8,inset -2px -3px 0 #464646;cursor:pointer;padding:0}
#topbtns button:hover{background:#7484c9}
#title{position:absolute;left:0;right:0;top:20%;text-align:center;opacity:0;transition:opacity .5s}
#title.show{opacity:1}
#title .t{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;font-size:clamp(34px,7vw,64px);text-shadow:4px 4px 0 #3f3f3f}
#title .s{font-size:clamp(20px,3vw,28px);color:#ffff7f;text-shadow:2px 2px 0 #3f3f00;margin-top:4px}
#toasts{position:absolute;right:10px;top:62px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:center;width:280px;background:#212121;border:2px solid #000;box-shadow:inset 2px 2px 0 #555,inset -2px -2px 0 #111;padding:8px 10px;animation:tin .4s ease-out}
.toast.out{transition:.4s;transform:translateX(320px)}
@keyframes tin{from{transform:translateX(320px)}}
.toast .ic{font-size:30px;width:40px;height:40px;display:grid;place-items:center;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff}
.toast .a{color:#ffff55;font-size:19px}.toast .b{font-size:20px}
#chat{position:absolute;left:10px;bottom:150px;width:min(520px,calc(100vw - 20px));display:flex;flex-direction:column;gap:2px}
.msg{background:rgba(0,0,0,.45);padding:2px 8px;font-size:20px;text-shadow:2px 2px 0 #3f3f3f;transition:opacity 1s;word-break:break-all}
.msg.fade{opacity:0}
.msg .n{color:#55ffff}.msg .y{color:#ffff55}.msg .g{color:#55ff55}.msg .p{color:#ff55ff}.msg .gr{color:#aaa}
#chatInput{position:absolute;left:10px;right:10px;bottom:112px;display:none;pointer-events:auto}
#chatInput input{width:100%;background:rgba(0,0,0,.6);border:none;outline:none;color:#fff;font:inherit;font-size:22px;padding:6px 10px;text-shadow:2px 2px 0 #3f3f3f}
#bottom{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
#stats{display:flex;justify-content:space-between;width:100%;font-size:15px;line-height:1}
#stats img{width:16px;height:16px;image-rendering:pixelated;margin-right:1px}
#stats .off{filter:grayscale(1) brightness(.4)}
#xp{position:relative;width:100%;height:9px;background:#1b1b1b;border:1px solid #000}
#xpfill{height:100%;width:0;background:linear-gradient(#a4f05a,#5fb31e);transition:width .6s}
#xplv{position:absolute;left:50%;top:-17px;transform:translateX(-50%);color:#80ff20;font-size:22px;text-shadow:-2px 0 #000,2px 0 #000,0 2px #000,0 -2px #000}
#hotbar{display:flex;background:#6b6b6b;border:2px solid #000;padding:2px;pointer-events:auto}
.hs{position:relative;width:46px;height:46px;display:grid;place-items:center;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #c6c6c6;margin:1px;cursor:pointer}
.hs img{width:32px;height:32px;image-rendering:pixelated}
.hs b{position:absolute;right:3px;bottom:0;font-size:16px;font-weight:normal;text-shadow:2px 2px 0 #3f3f3f}
.hs.sel{outline:3px solid #fff;outline-offset:-1px;z-index:1}
.hs:hover{background:#a0a0b8}
#tooltip{position:fixed;z-index:60;pointer-events:none;background:rgba(16,0,16,.94);border:2px solid #2c0a5e;padding:4px 9px;font-size:20px;color:#fff;display:none;max-width:320px;box-shadow:0 0 0 2px rgba(16,0,16,.94)}
#tooltip .s{color:#aaa;font-size:17px}#tooltip .e{color:#b88cff}
#mobileTip{display:none}
/* ---------- panel ---------- */
#panel{position:fixed;left:50%;top:50%;z-index:30;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;width:min(700px,calc(100vw - 24px));max-height:min(84vh,780px);overflow:auto;background:#c6c6c6;color:#3f3f3f;border:3px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555;padding:22px 22px 20px;font-size:21px;-webkit-user-select:text;user-select:text}
#panel.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#panel h2{margin:0 0 6px;font-size:32px;color:#2b2b2b;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:800}
#panel h3{margin:14px 0 6px;font-size:23px;color:#404040}
#panel p{margin:6px 0;line-height:1.35}
#panel .sub{font-size:18px;color:#6a6a6a;letter-spacing:1px}
#panel .x{position:sticky;float:right;top:-10px;margin:-10px -10px 0 0;width:36px;height:36px;padding:0;min-height:0;z-index:2}
#panel .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#panel .dim{color:#777}
#panel a{color:#2c4fbf}
#panel .btn{color:#fff}
.inset{background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;padding:10px}
.prof{display:grid;grid-template-columns:200px 1fr;gap:18px}
.pframe{background:#8b5a2b;padding:8px;box-shadow:inset 3px 3px 0 #b07a44,inset -3px -3px 0 #5a3716}
.pframe img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;image-rendering:auto}
.pframe .cap{text-align:center;color:#fff;text-shadow:2px 2px 0 #3f3f3f;padding-top:6px}
.kv{list-style:none;margin:8px 0 0;padding:0}
.kv li{display:flex;gap:10px;padding:4px 0;border-bottom:2px dashed #aaa}
.kv b{min-width:96px;color:#555;font-weight:normal}
.ench{color:#7a3fd1;animation:glint 2.4s linear infinite}
@keyframes glint{50%{color:#c58bff;text-shadow:0 0 6px #e3c7ff}}
.hearts{font-size:18px;letter-spacing:-2px}
.grid9{display:grid;grid-template-columns:repeat(9,1fr);gap:0;background:#c6c6c6}
.slot{aspect-ratio:1;display:grid;place-items:center;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;cursor:pointer;position:relative}
.slot img{width:70%;image-rendering:pixelated}
.slot:hover{background:#b0b0b0}
.slot.empty{cursor:default}
.slot .num{position:absolute;right:3px;bottom:0;color:#fff;font-size:15px;text-shadow:2px 2px 0 #3f3f3f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:3px 10px;background:#a8a8a8;border:2px solid #555;cursor:pointer;font-size:19px}
.chip.on{background:#3f8f2e;color:#fff;border-color:#1f5214}
.proj{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.proj .icon{background:#8b5a2b;padding:10px;box-shadow:inset 3px 3px 0 #b07a44,inset -3px -3px 0 #5a3716}
.proj .icon div{background:#ead9b0;aspect-ratio:1;display:grid;place-items:center}
.proj .icon img{width:80%;image-rendering:pixelated}
.tag{display:inline-block;background:#3a3a3a;color:#ffff55;padding:1px 8px;font-size:18px}
.term{background:#0d1117;color:#c9d1d9;font-family:'VT323',monospace;font-size:21px;padding:14px;min-height:340px;white-space:pre-wrap;line-height:1.2;box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #444}
.term .k{color:#ff7b72}.term .s{color:#a5d6ff}.term .c{color:#8b949e}.term .f{color:#d2a8ff}.term .o{color:#7ee787}.term .cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.book{background:#f3e7c4;color:#3b2a16;box-shadow:inset 3px 3px 0 #fff6dc,inset -3px -3px 0 #c9b383;padding:18px 22px;min-height:300px;font-size:22px;line-height:1.45}
.book .pg{text-align:right;color:#8a7350;font-size:18px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.bar{height:14px;background:#373737;box-shadow:inset 2px 2px 0 #000}
.bar i{display:block;height:100%;background:linear-gradient(#a4f05a,#5fb31e)}
.bar.gold i{background:linear-gradient(#ffe066,#d49a00)}
.bar.purple i{background:linear-gradient(#e0b3ff,#8a3fd1)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.card{background:#a9a9a9;box-shadow:inset 2px 2px 0 #dcdcdc,inset -2px -2px 0 #555;padding:12px}
.card .e{font-size:34px}
.card b{display:block;font-size:22px;color:#2b2b2b}
.contact .card{display:flex;flex-direction:column;gap:6px}
.contact .v{font-size:20px;word-break:break-all;color:#222}
.mug{width:110px;height:140px;margin:10px auto;position:relative;border:6px solid #e8f4ff;border-top:none;background:rgba(255,255,255,.15)}
.mug::after{content:'';position:absolute;right:-34px;top:24px;width:24px;height:60px;border:6px solid #e8f4ff;border-left:none}
.mug .beer{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#f7b733,#d97a00);transition:height 2s ease-in}
.mug .foam{position:absolute;left:-2px;right:-2px;height:0;background:#fffaf0;transition:all 2s ease-in;bottom:0}
.roul{font-size:40px;text-align:center;padding:26px 6px;background:#1b1b1b;color:#ffff55;box-shadow:inset 3px 3px 0 #000,inset -3px -3px 0 #555;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:800;min-height:120px}
.roul img{width:52px;image-rendering:pixelated;vertical-align:middle;margin-right:10px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ach div{display:flex;gap:8px;align-items:center;padding:6px;background:#a9a9a9;box-shadow:inset 2px 2px 0 #dcdcdc,inset -2px -2px 0 #555}
.ach div.lock{filter:grayscale(1);opacity:.55}
.ach span{font-size:28px}
.ach small{display:block;color:#555;font-size:16px}
kbd{background:#555;color:#fff;padding:0 6px;border-bottom:3px solid #222;font-family:inherit}
#fade{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;display:grid;place-items:center;font-size:34px}
#fade.on{opacity:1}
@media (max-width:640px){
  .prof,.proj{grid-template-columns:1fr}
  .pframe{max-width:180px;margin:0 auto}
  .proj .icon{max-width:140px;margin:0 auto}
  .hs{width:36px;height:36px}.hs img{width:24px;height:24px}.hs b{font-size:13px}
  #dbg{font-size:16px}
  #topbtns button{width:36px;height:36px;font-size:17px}
  #toasts{top:52px}.toast{width:230px}
  #chat{bottom:126px;width:calc(100vw - 20px)}.msg{font-size:17px}
  #chatInput{bottom:96px}
  #panel{padding:16px;font-size:19px}
  .grid9{grid-template-columns:repeat(6,1fr)}
}
</style>

const CODE_COLORS = [['#ff7b72', '#d2a8ff', '#a5d6ff', '#7ee787', '#c9d1d9', '#c9d1d9'], ['#f7df1e', '#c792ea', '#82aaff', '#c3e88d', '#eeffff', '#eeffff']];
function addCodeLine(i) { const segs = []; let x = 2 + (Math.random() * 4 | 0) * 3; const n = 1 + (Math.random() * 4 | 0); for (let k = 0; k < n && x < 58; k++) { const w = 3 + (Math.random() * 10 | 0); segs.push([x, Math.min(w, 60 - x), CODE_COLORS[i][Math.random() * 6 | 0]]); x += w + 2; } codeLines[i].push(segs); if (codeLines[i].length > 11) codeLines[i].shift(); }
for (let i = 0; i < 11; i++) { addCodeLine(0); addCodeLine(1); }
function drawCode(s, i) {
  const g = s.g; g.fillStyle = i ? '#1e1e2e' : '#0d1117'; g.fillRect(0, 0, 64, 40);
  g.fillStyle = i ? '#f7df1e' : '#3776ab'; g.fillRect(0, 0, 64, 4); g.fillStyle = i ? '#000' : '#ffd43b'; g.fillRect(2, 1, i ? 6 : 8, 2);
  codeLines[i].forEach((segs, y) => segs.forEach(([x, w, c]) => { g.fillStyle = c; g.fillRect(x, 6 + y * 3, w, 2); }));
  if ((time * 2 | 0) % 2) { g.fillStyle = '#fff'; g.fillRect(4, 6 + codeLines[i].length * 3 - 3, 2, 2); }
  s.t.needsUpdate = true;
}
const SN = { s: [[8, 9], [7, 9], [6, 9]], d: [1, 0], f: [20, 9] };
function snakeStep() {
  const W = 32, H = 18, h = SN.s[0], f = SN.f;
  const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(d => !(d[0] === -SN.d[0] && d[1] === -SN.d[1]))
    .map(d => [d, (h[0] + d[0] + W) % W, (h[1] + d[1] + H) % H]).filter(([, x, y]) => !SN.s.some(p => p[0] === x && p[1] === y))
    .sort((a, b) => (Math.abs(a[1] - f[0]) + Math.abs(a[2] - f[1])) - (Math.abs(b[1] - f[0]) + Math.abs(b[2] - f[1])));
  if (!opts.length || SN.s.length > 45) { SN.s = [[8, 9], [7, 9], [6, 9]]; SN.d = [1, 0]; return; }
  const [d, x, y] = Math.random() < .08 && opts[1] ? opts[1] : opts[0]; SN.d = d; SN.s.unshift([x, y]);
  if (x === f[0] && y === f[1]) SN.f = [Math.random() * W | 0, Math.random() * H | 0]; else SN.s.pop();
  const g = tvS.g; g.fillStyle = '#0b1a0b'; g.fillRect(0, 0, 64, 36);
  g.fillStyle = '#ff4d4d'; g.fillRect(SN.f[0] * 2, SN.f[1] * 2, 2, 2);
  SN.s.forEach((p, i) => { g.fillStyle = i ? '#59d12e' : '#c6ff7a'; g.fillRect(p[0] * 2, p[1] * 2, 2, 2); });
  tvS.t.needsUpdate = true;
}
const INV = ['00100100', '00011000', '00111100', '01011010', '11111111', '10111101', '10100101', '00011000'];
function drawArcade() {
  const g = arcS.g; g.fillStyle = '#05051a'; g.fillRect(0, 0, 32, 32);
  const ox = 4 + Math.round(Math.sin(time * 2) * 4); const cols = ['#ff55ff', '#55ffff', '#ffff55'];
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) INV.forEach((row, y) => [...row].forEach((b, x) => { if (b === '1') { g.fillStyle = cols[(r + c) % 3]; g.fillRect(ox + c * 12 + x, 3 + r * 10 + y, 1, 1); } }));
  g.fillStyle = '#55ff55'; g.fillRect(14 + Math.round(Math.sin(time) * 10), 28, 4, 2);
  if ((time * 3 | 0) % 2) { g.fillStyle = '#fff'; g.fillRect(16, 24 - (time * 20 % 18), 1, 2); }
  arcS.t.needsUpdate = true;
}

$('#bHelp').onclick = () => openPanel(helpHTML());
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let codeT = 0, snakeT = 0, hudT = 0, lastRegion = null, regionT = 0, smokeT = 0, beerDecay = 0;
function updateWorld(dt) {
  waterTex.offset.x = time * .05; waterTex.offset.y = Math.sin(time * .5) * .05;
  duck.position.set(13 + Math.cos(time * .3) * 2.6, .42 + Math.sin(time * 2) * .04, 7 + Math.sin(time * .3) * 2.6); duck.rotation.y = -time * .3;
  flames.forEach((f, i) => { f.scale.y = .25 + Math.abs(Math.sin(time * 9 + i * 1.7)) * .35; f.position.y = .65 + f.scale.y / 2; });
  clouds.children.forEach(c => { c.position.x += dt * 1.6; if (c.position.x > 170) c.position.x = -170; });
  if ((codeT += dt) > .35) { codeT = 0; addCodeLine(Math.random() < .5 ? 0 : 1); drawCode(scr1, 0); drawCode(scr2, 1); drawArcade(); }
  if ((snakeT += dt) > .09) { snakeT = 0; snakeStep(); }
  const roofOn = roofForced !== null ? roofForced : !inHouse(av.pos.x, av.pos.z);
  G.roof.visible = roofOn; G.upper.visible = roofOn || roofForced === true;
  if ((smokeT += dt) > .35) { smokeT = 0; if (roofOn) burst(new V3(-13, 10.8, -15), ['#bbbbbb', '#999999'], 1, { up: 1.2, speed: .3, grav: -.8, size: .3, life: 2.5 }); burst(new V3(14, 1.2, -7), ['#aaaaaa'], 1, { up: 1, speed: .3, grav: -1, size: .14, life: 1.6 }); }
  if (marker.material.opacity > 0) marker.rotation.z += dt * 2;
  if ((beerDecay += dt) > 45) { beerDecay = 0; if (beer > 2) { beer--; renderStats(); } }
}
function updateHUD(dt) {
  if ((hudT += dt) < .2) return; hudT = 0;
  const p = av.pos, r = region(p.x, p.z);
  const hour = Math.round(6 + day * 6 + (1 - day) * 16) % 24;
  $('#dbg').innerHTML = `<span>马清雄的方块小屋 · 1.0</span><br><span>XYZ: ${p.x.toFixed(1)} / ${(p.y + 63.5).toFixed(0)} / ${p.z.toFixed(1)}</span><br><span>区域: ${REGIONS[r][0]} · ${day > .5 ? '☀️ 白天' : '🌙 夜晚'}${raining ? ' · 🌧️' : ''}</span>`;
  if (r !== lastRegion) { if ((regionT += .2) > .6) { lastRegion = r; regionT = 0; if (started && !intro) showTitle(...REGIONS[r]); } } else regionT = 0;
}
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05); time += dt;
  updateAvatar(dt); updatePet(cat, dt); updatePet(dog, dt); updateParts(dt); updateSky(dt); updateWorld(dt); updateCamera(dt); updateHover();
  updateHUD(dt);
  renderer.render(scene, camera);
}
drawCode(scr1, 0); drawCode(scr2, 1); drawArcade(); snakeStep();
camera.position.set(-10.5, 60, 70); controls.target.set(-10.5, 1.7, 4); camera.lookAt(controls.target);
progress(1, '世界已生成！');
loop();
const enter = $('#enter'); enter.style.display = 'inline-flex'; $('#loadtxt').textContent = touch ? '点击开始 · 触屏可玩' : '戴上耳机效果更佳 🎧';
enter.onclick = () => {
  ac(); $('#loading').classList.add('hide'); started = true;
  intro = { t: 0, from: camera.position.clone() };
  setTimeout(() => { unlock('welcome'); say('欢迎来到我的方块小屋！我是马清雄 👋'); }, 1200);
  setTimeout(() => chat(`<span class="gr">提示：${touch ? '点击地面移动，点击物体互动，底部快捷栏可快速传送' : 'WASD 移动 · 点击物体互动 · 1-9 快速传送 · T 聊天'}</span>`), 2600);
  setTimeout(() => chat('<span class="gr">试试点击：欢迎牌、单车、猫狗、远处的小蛮腰 🗼</span>'), 4200);
  setTimeout(() => { if (!uiOpen && !got.has('profile')) openPanel(helpHTML()); }, 3400);
};
window.__mc = { av, scene, camera, controls, hotbar, openProfile, useChest, get day() { return day; }, set dayTarget(v) { dayTarget = v; } };
</script>
